name: Android APK

# Builds a debug-signed APK on every push. Download it from the run's "Corridor12-apk" artifact,
# or (on main) from the "latest" release.
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7-stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot

      - name: Cache Android export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-android-templates-${{ env.GODOT_VERSION }}

      - name: Download Android export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$dir"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -oq -j templates.tpz "templates/android_*" "templates/version.txt" -d "$dir"
          ls "$dir"
          rm templates.tpz

      - name: Debug keystore and editor settings
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          # Point the editor at the runner's Android SDK and JDK.
          major="${GODOT_VERSION%%.*}"
          mkdir -p "$HOME/.config/godot"
          for f in "editor_settings-${major}.tres" "editor_settings-${GODOT_VERSION%-*}.tres"; do
            cat > "$HOME/.config/godot/$f" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
            sed -i 's/^          //' "$HOME/.config/godot/$f"
          done
          cat "$HOME/.config/godot/editor_settings-${major}.tres"

      - name: Import and test
        run: |
          ./godot --headless --path . --import
          ./godot --headless --path . res://tests/test_runner.tscn

      - name: Export APK
        run: |
          mkdir -p build/android
          ./godot --headless --path . --export-debug "Android" build/android/Corridor12.apk
          test -f build/android/Corridor12.apk
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: Corridor12-apk
          path: build/android/Corridor12.apk

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/android/Corridor12.apk --title "أحدث نسخة" --notes "نسخة تجريبية من ${GITHUB_SHA::7}" --prerelease
